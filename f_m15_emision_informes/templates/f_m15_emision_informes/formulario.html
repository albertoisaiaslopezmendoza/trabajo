{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h2>{{ accion }} Informe / Certificado</h2>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="mt-3">
            <button type="submit" class="btn btn-success">Guardar</button>
            <a href="{% url 'm15_dashboard' %}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
